<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202722" media="(prefers-color-scheme: dark)">
  {{template "theme_bootstrap" .}}
  <title>搜索文章 · {{.SiteName}}</title>
  <meta name="description" content="搜索{{.SiteName}}已发布的文章。">
  {{template "page_metadata" .Meta}}
  <link rel="stylesheet" href="{{.AssetURL}}">
  {{if .ScriptURL}}<script src="{{.ScriptURL}}" defer></script>{{end}}
  {{if .SearchScriptURL}}<script src="{{.SearchScriptURL}}" defer></script>{{end}}
</head>
<body class="search-page">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  {{template "public_header" .}}
  <main id="main-content" class="search-route-main"><h1 class="visually-hidden">搜索文章</h1></main>
  {{template "public_footer" .}}
</body>
</html>
