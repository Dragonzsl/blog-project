<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>初始化 · 个人博客</title>
  <link rel="stylesheet" href="/admin/assets/admin.css?v=6">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro" aria-labelledby="setup-title">
      <div class="wordmark"><span aria-hidden="true">✦</span> Personal Press</div>
      <p class="eyebrow">首次设置</p>
      <h1 id="setup-title">建立只属于你的写作空间。</h1>
      <p class="lede">一个站点，一位站主。无需邮件或外部账号，数据完整保留在你的服务器上。</p>
      <ol class="step-list" aria-label="初始化步骤">
        <li class="active"><span>01</span>站点与站主</li>
        <li><span>02</span>绑定验证器</li>
        <li><span>03</span>保存恢复码</li>
      </ol>
    </section>
    <section class="auth-card">
      <div>
        <p class="eyebrow">步骤 1 / 3</p>
        <h2>创建站主</h2>
        <p class="muted">密码至少 12 个字符；完成后还需要绑定 TOTP 验证器。</p>
      </div>
      {{if .Error}}<div class="notice error" role="alert">{{.Error}}</div>{{end}}
      <form method="post" action="/admin/setup/start" class="stack">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <label>站点名称<input name="site_name" value="{{.SiteName}}" maxlength="100" autocomplete="organization" required autofocus></label>
        <label>站主用户名<input name="username" value="{{.Username}}" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" autocomplete="username" required></label>
        <label>密码<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
        <label>确认密码<input type="password" name="password_confirm" minlength="12" maxlength="128" autocomplete="new-password" required></label>
        <button type="submit">继续绑定验证器 <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>
</body>
</html>
