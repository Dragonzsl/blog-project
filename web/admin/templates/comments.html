<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>评论审核</title><link rel="stylesheet" href="/admin/assets/admin.css?v=7"></head>
<body class="admin-page"><header class="admin-header"><a class="wordmark" href="/admin/">✦ 站主管理</a><nav><a class="nav-link" href="/admin/articles">文章</a><a class="nav-link active" href="/admin/plugins/comments.local/comments">评论</a></nav></header><main class="content-shell"><div class="page-heading"><div><p class="eyebrow">Comments</p><h1>评论审核。</h1></div><p class="heading-note">评论默认进入待审核状态；审核失败不会影响文章发布。</p></div><section class="article-table" aria-label="待审核评论">{{range .Comments}}<article class="article-row"><div><span class="status-label">待审核</span><h2>{{.DisplayName}}</h2><p>{{.BodyMarkdown}}</p></div><div class="row-meta"><form method="post" action="/admin/plugins/comments.local/comments/{{.ID}}/moderate"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><input type="hidden" name="status" value="approved"><button class="button-link small" type="submit">通过</button></form><form method="post" action="/admin/plugins/comments.local/comments/{{.ID}}/moderate"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><input type="hidden" name="status" value="spam"><button class="danger-button" type="submit">标记垃圾</button></form></div></article>{{else}}<p class="empty-copy">暂无待审核评论。</p>{{end}}</section></main></body></html>
