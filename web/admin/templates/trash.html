<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>回收站 · {{.SiteName}}</title><link rel="stylesheet" href="/admin/assets/admin.css?v=6"></head>
<body class="admin-page"><header class="admin-header"><a class="wordmark" href="/admin/"><span aria-hidden="true">✦</span> {{.SiteName}}</a><nav aria-label="内容管理"><a class="nav-link" href="/admin/articles">文章</a><a class="nav-link" href="/admin/pages">页面</a><a class="nav-link active" href="/admin/trash">回收站</a></nav></header>
<main class="content-shell"><div class="page-heading"><div><p class="eyebrow">Trash</p><h1>可以反悔的删除。</h1></div><p class="heading-note">恢复后始终回到草稿；超过保留期的内容由后台分批永久清理，历史路径不会重新分配。</p></div>{{if .Contents}}<div class="article-table">{{range .Contents}}<article class="article-row"><div><span class="status-label">{{.Kind}}</span><h2>{{.Title}}</h2><p>移入时间 · {{.TrashedAt}}</p></div><form method="post" action="/admin/trash/{{.ID}}/restore"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button type="submit" class="quiet-button">恢复为草稿</button></form></article>{{end}}</div>{{else}}<section class="empty-state"><span aria-hidden="true">◇</span><h2>回收站是空的。</h2><p>被移除的文章与页面会暂存在这里。</p></section>{{end}}</main></body></html>
