<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>回收站 · {{.SiteName}}</title><link rel="stylesheet" href="/admin/assets/admin.css?v=8"></head>
<body class="admin-page">
  {{template "admin_header" .}}
  <main id="trash-results" class="content-shell" tabindex="-1">
    <div class="page-heading"><div><p class="eyebrow">Trash</p><h1>可以反悔的删除。</h1></div><p class="heading-note">恢复后始终回到草稿；超过保留期的内容由后台分批永久清理，历史路径不会重新分配。</p></div>
    {{if .Contents}}<div class="article-table">{{range .Contents}}<article class="article-row"><div><span class="status-label">{{.Kind}}</span><h2>{{.Title}}</h2><p class="metadata-unit">移入时间 · {{.TrashedAt}}</p></div><form method="post" action="/admin/trash/{{.ID}}/restore"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button type="submit" class="quiet-button">恢复为草稿</button></form></article>{{end}}</div>{{else}}<section class="empty-state"><span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M6 8h12M9 8V5h6v3m-7 0 .7 11h4.6L14 8M10 11v5m4-5v5"/></svg></span><h2>回收站是空的。</h2><p>被移除的文章与页面会暂存在这里。</p></section>{{end}}
  </main>
  {{template "admin_footer" .}}
</body>
</html>
