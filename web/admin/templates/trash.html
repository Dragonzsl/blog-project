<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>回收站 · {{.SiteName}}</title><link rel="stylesheet" href="/admin/assets/admin.css?v=8"></head>
<body class="admin-page">
  {{template "admin_header" .}}
  <main id="trash-results" class="content-shell" tabindex="-1">
    <div class="page-heading"><div><p class="eyebrow">Trash</p><h1>可以反悔的删除。</h1></div><p class="heading-note">恢复后始终回到草稿；超过保留期的内容由后台分批永久清理，历史路径不会重新分配。</p></div>
    {{if .Contents}}<form id="trash-bulk-form" method="post" action="/admin/trash/bulk" data-submit-feedback data-confirm="批量恢复会把选中内容全部恢复为草稿。确定继续吗？"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><input type="hidden" name="operation_key" value="{{.BulkOperationKey}}"><div class="bulk-toolbar"><label class="bulk-confirm"><input type="checkbox" name="confirm_action" value="1" required> 我已确认将选中的内容恢复为草稿</label><button type="submit" class="quiet-button">恢复选中内容为草稿</button><span>单次最多 50 项</span></div><div class="article-table">{{range .Contents}}<article class="article-row"><div><label class="bulk-select"><input type="checkbox" name="trash_items" value="{{.KindKey}}:{{.ID}}:{{.LockVersion}}"><span class="visually-hidden">选择 {{.Title}}</span></label><span class="status-label">{{.Kind}}</span><h2>{{.Title}}</h2><p class="metadata-unit">移入时间 · {{.TrashedAt}}</p></div><button class="quiet-button" type="submit" name="single_item" value="{{.KindKey}}:{{.ID}}:{{.LockVersion}}">恢复为草稿</button></article>{{end}}</div></form>{{else}}<section class="empty-state"><span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M6 8h12M9 8V5h6v3m-7 0 .7 11h4.6L14 8M10 11v5m4-5 v5"/></svg></span><h2>回收站是空的。</h2><p>被移除的文章与页面会暂存在这里。</p></section>{{end}}
  </main>
  {{template "admin_footer" .}}
</body>
</html>
