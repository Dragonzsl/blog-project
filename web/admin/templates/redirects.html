<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>重定向管理</title><link rel="stylesheet" href="/admin/assets/admin.css?v=8"></head>
<body class="admin-page">{{template "admin_header" .}}<main class="content-shell"><div class="page-heading"><div><p class="eyebrow">Redirects</p><h1>重定向管理。</h1></div><p class="heading-note">用于迁移旧链接；仅允许站内路径，避免开放重定向风险。</p></div>
{{template "admin_feedback" .}}<section class="form-card"><form method="post" action="/admin/redirects"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label>旧路径<input name="source_path" required placeholder="/posts/old-slug"></label><label>新路径<input name="target_path" required placeholder="/posts/new-slug"></label><label>状态码<select name="status_code"><option value="301">301 永久</option><option value="308">308 永久（保留方法）</option></select></label><button class="button-link" type="submit">保存重定向</button></form></section>
<section class="article-table" aria-label="重定向列表">{{range .Redirects}}<article class="article-row"><div><strong>{{.SourcePath}}</strong><span class="muted">→ {{.TargetPath}}</span></div><div class="row-meta"><span>{{.StatusCode}}</span>{{if eq .Reason "manual"}}<form method="post" action="/admin/redirects/{{.ID}}/delete"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button class="danger-button" type="submit">删除</button></form>{{else}}<span class="muted">自动</span>{{end}}</div></article>{{else}}<p class="empty-copy">暂无重定向。</p>{{end}}</section></main>{{template "admin_footer" .}}</body></html>
