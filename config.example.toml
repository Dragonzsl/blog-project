[server]
listen_address = ":8080"
shutdown_timeout = "10s"

[storage]
data_dir = "./data"
adapter = "local"

[storage.s3]
endpoint = ""
bucket = ""
region = "us-east-1"
access_key = ""
secret_key = ""
prefix = "blog/"
force_path_style = false
use_tls = true

[database]
path = "db/blog.sqlite"
busy_timeout = "5s"
cache_size_kib = 16384
read_connections = 2

[media]
# 原文件始终按原始字节保存；下列设置只影响上传限制和派生预览图。
max_upload_bytes = 12582912
max_image_pixels = 16000000
variant_widths = [640, 1280]
jpeg_quality = 92

[publishing]
scheduler_interval = "15s"
scheduler_batch_size = 20
editing_snapshot_interval = "15s"
revision_limit = 50
trash_retention_days = 30
trash_cleanup_interval = "6h"

[discovery]
# 用于 canonical、RSS、Sitemap 和 robots；生产环境请改为站点公开 HTTPS 地址。
base_url = "http://localhost:8080"
sync_batch_size = 20
max_results = 50
feed_limit = 50
sitemap_limit = 50000

[operations]
backup_interval = "24h"
backup_daily_retention = 7
backup_weekly_retention = 4

[logging]
level = "info"
format = "text"

[security]
auth_secret_file = "secrets/auth.key"
cookie_secure = false
session_lifetime = "12h"

[extensions]
theme_package_max_bytes = 33554432
theme_max_files = 256
theme_max_unpacked_bytes = 67108864
enabled_plugins = []

[analytics]
enabled = false
retention_days = 365

[comments]
enabled = false
require_moderation = true
provider = "local"

[mail]
enabled = false
host = ""
port = 587
username = ""
password = ""
from = ""
starttls = true

[newsletter]
enabled = false
provider = "disabled"
endpoint = ""
