name: personal-blog

services:
  data-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    user: "0:0"
    mem_limit: 32m
    pids_limit: 32
    command: ["sh", "-c", "mkdir -p /data/db /data/media /data/cache /data/backups && chown -R 65532:65532 /data"]
    volumes:
      - blog_data:/data
    restart: "no"

  app:
    build:
      context: .
      args:
        VERSION: ${BLOG_VERSION:-dev}
        COMMIT: ${BLOG_COMMIT:-unknown}
        BUILD_TIME: ${BLOG_BUILD_TIME:-unknown}
    image: personal-blog:${BLOG_VERSION:-dev}
    user: "65532:65532"
    read_only: true
    init: true
    mem_limit: 256m
    cpus: 0.85
    pids_limit: 128
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      BLOG_LISTEN_ADDRESS: ":8080"
      BLOG_DATA_DIR: ${BLOG_DATA_DIR:-/data}
      BLOG_LOG_LEVEL: ${BLOG_LOG_LEVEL:-info}
      BLOG_LOG_FORMAT: ${BLOG_LOG_FORMAT:-json}
      BLOG_AUTH_SECRET: ${BLOG_AUTH_SECRET:-}
      BLOG_COOKIE_SECURE: "true"
      GOMEMLIMIT: ${BLOG_MEMORY_LIMIT:-192MiB}
    volumes:
      - blog_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/blog", "healthcheck", "--url", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    mem_limit: 64m
    cpus: 0.15
    pids_limit: 64
    depends_on:
      app:
        condition: service_healthy
    environment:
      BLOG_SITE_ADDRESS: ${BLOG_SITE_ADDRESS:-https://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  blog_data:
  caddy_data:
  caddy_config:
